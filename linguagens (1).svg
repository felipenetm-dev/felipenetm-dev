<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Gráfico de pizza: 60% C e 40% Java" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050A"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3B44"/>
      <stop offset="1" stop-color="#9E1017"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BE0"/>
      <stop offset="1" stop-color="#003A80"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="559" height="319" rx="14" fill="url(#bg)" stroke="#E62429" stroke-opacity="0.7"/>
  <text x="280" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Linguagens que estou aprendendo</text>
  <line x1="200" y1="52" x2="360" y2="52" stroke="#E62429" stroke-width="2" stroke-linecap="round"/>

  <!-- Pizza: C 60% / Java 40% -->
  <circle cx="160" cy="185" r="112" fill="#000000" opacity="0.35"/>
  <path d="M160,185 L160,80 A105,105 0 1 1 98.28,269.95 Z" fill="url(#red)" stroke="#03050A" stroke-width="3"/>
  <path d="M160,185 L98.28,269.95 A105,105 0 0 1 160,80 Z" fill="url(#blue)" stroke="#03050A" stroke-width="3"/>
  <text x="217" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">60%</text>
  <text x="103" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">40%</text>

  <!-- Card C -->
  <rect x="320" y="110" width="210" height="70" rx="12" fill="#0C1428" stroke="#E62429" stroke-opacity="0.6"/>
  <polygon points="355,121 375.8,133 375.8,157 355,169 334.2,157 334.2,133" fill="#0057B8" stroke="#3D8BFF" stroke-width="1.5"/>
  <path d="M363,139 A9.5,9.5 0 1 0 363,151" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <text x="392" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Linguagem C</text>
  <text x="392" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#FF6B73">60% do foco</text>

  <!-- Card Java -->
  <rect x="320" y="200" width="210" height="70" rx="12" fill="#0C1428" stroke="#3D8BFF" stroke-opacity="0.6"/>
  <path d="M347,214 q-4,-5 0,-9 q4,-5 0,-9" fill="none" stroke="#E62429" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M358,214 q-4,-5 0,-9 q4,-5 0,-9" fill="none" stroke="#E62429" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M339,222 H369 V238 Q369,249 358,249 H350 Q339,249 339,238 Z" fill="#3D8BFF"/>
  <path d="M369,226 q10,0 10,8 q0,8 -10,8" fill="none" stroke="#3D8BFF" stroke-width="3"/>
  <line x1="336" y1="255" x2="372" y2="255" stroke="#3D8BFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="392" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Java</text>
  <text x="392" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7DB3FF">40% do foco</text>
</svg>
