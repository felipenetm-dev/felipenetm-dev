<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="Gráfico de pizza: 60% C e 40% Java" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0.5" y="0.5" width="479" height="299" rx="12" fill="#0B1A3D" stroke="#E62429" stroke-width="1"/>
  <text x="240" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Linguagens que estou aprendendo</text>

  <!-- Fatia C: 60% -->
  <path d="M150,170 L150,60 A110,110 0 1 1 85.35,258.99 Z" fill="#E62429" stroke="#0B1A3D" stroke-width="2"/>
  <!-- Fatia Java: 40% -->
  <path d="M150,170 L85.35,258.99 A110,110 0 0 1 150,60 Z" fill="#0057B8" stroke="#0B1A3D" stroke-width="2"/>

  <!-- Porcentagens dentro das fatias -->
  <text x="195" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">60%</text>
  <text x="112" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">40%</text>

  <!-- Legenda -->
  <rect x="300" y="125" width="18" height="18" rx="3" fill="#E62429"/>
  <text x="326" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#FFFFFF">C — 60%</text>
  <rect x="300" y="165" width="18" height="18" rx="3" fill="#0057B8"/>
  <text x="326" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#FFFFFF">Java — 40%</text>
</svg>
